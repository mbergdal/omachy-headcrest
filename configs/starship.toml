# Omachy Starship prompt

format = """
$hostname\
$directory\
$custom.hg_prompt\
$custom.git_prompt\
$line_break\
$character"""

right_format = "$status"

[hostname]
ssh_only = false
disabled = false
format = "[$hostname]($style)[:: ](bold blue)"
style = "bold #89b4fa"
trim_at = "."

[directory]
format = "[$path ]($style)"
style = "#a6e3a1"
truncation_length = 3
truncate_to_repo = false

[custom.hg_prompt]
command = '''
branch=$(hg branch 2>/dev/null)
if [ -z "$branch" ]; then
	exit 0
fi

dirty=""
if [ -n "$(hg status 2>/dev/null)" ]; then
	dirty=" ✗"
fi

printf "hg:‹%s%s› " "$branch" "$dirty"
'''
when = "hg root >/dev/null 2>&1"
format = "[$output]($style)"
style = "bold #cba6f7"

[custom.git_prompt]
command = '''
branch=$(git branch --show-current 2>/dev/null)
if [ -z "$branch" ]; then
	branch=$(git rev-parse --short HEAD 2>/dev/null)
fi
if [ -z "$branch" ]; then
	exit 0
fi

dirty=""
if ! git diff --quiet --ignore-submodules -- 2>/dev/null || \
   ! git diff --cached --quiet --ignore-submodules -- 2>/dev/null || \
   [ -n "$(git ls-files --others --exclude-standard 2>/dev/null)" ]; then
	dirty="*"
fi

printf "‹%s%s› " "$branch" "$dirty"
'''
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[$output]($style)"
style = "bold #f9e2af"

[line_break]
disabled = false

[character]
success_symbol = "[»](bold #89b4fa)"
error_symbol = "[»](bold #f38ba8)"

[status]
disabled = false
format = "[$status ↵]($style)"
style = "bold #f38ba8"
